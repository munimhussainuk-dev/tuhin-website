name: Auto Fetch & Archive Byline News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install rss-parser

      - name: Fetch Latest Stories
        run: node scripts/fetch-news.js

      - name: Commit Updated Stories JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stories.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update archived byline stories"
          git push
