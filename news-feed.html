<script>
    // RSS Feed Sources List
    const rssFeeds = [
        { name: "Protidiner Sangbad", url: "https://www.protidinersangbad.com/rss.xml" },
        { name: "Bangladesh Guardian", url: "https://bangladeshguardian.com/rss.xml" }
    ];

    // Byline Search Terms
    const bylineKeywords = [
        "তুহিন আহমদ, সিলেট",
        "তুহিন আহমদ (সিলেট)",
        "তুহিন আহমদ",
        "Tuhin Ahmed"
    ];

    async function fetchFeeds() {
        const container = document.getElementById('feed-container');
        const loading = document.getElementById('loading');
        let articles = [];

        for (const feed of rssFeeds) {
            try {
                // Using RSS2JSON service
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
                const data = await res.json();

                if (data.status === 'ok') {
                    data.items.forEach(item => {
                        const fullContent = `${item.title} ${item.description} ${item.content || ''} ${item.author || ''}`;
                        
                        const isBylineMatch = bylineKeywords.some(keyword => fullContent.includes(keyword));

                        if (isBylineMatch) {
                            articles.push({
                                source: feed.name,
                                title: item.title,
                                link: item.link,
                                pubDate: new Date(item.pubDate),
                                description: item.description.replace(/<[^>]*>?/gm, '').slice(0, 180) + '...'
                            });
                        }
                    });
                }
            } catch (err) {
                console.error("Error fetching feed:", feed.name, err);
            }
        }

        loading.style.display = 'none';

        if (articles.length === 0) {
            container.innerHTML = `
                <div class="feed-card">
                    <div class="feed-meta"><span class="source-badge">System Status</span></div>
                    <h3>Automated Monitoring Active</h3>
                    <p class="feed-excerpt">The feed scraper actively checks Protidiner Sangbad and Bangladesh Guardian for reports published under <strong>"তুহিন আহমদ, সিলেট"</strong>. New publications will appear automatically as feeds update.</p>
                </div>
            `;
            return;
        }

        articles.sort((a, b) => b.pubDate - a.pubDate);

        articles.forEach(article => {
            const card = document.createElement('div');
            card.className = 'feed-card';
            card.innerHTML = `
                <div class="feed-meta">
                    <span class="source-badge">${article.source}</span>
                    <span>${article.pubDate.toLocaleDateString()}</span>
                </div>
                <h3><a href="${article.link}" target="_blank" rel="noopener">${article.title}</a></h3>
                <p class="feed-excerpt">${article.description}</p>
                <a href="${article.link}" target="_blank" rel="noopener" class="source-link">Read full report on ${article.source} ↗</a>
            `;
            container.appendChild(card);
        });
    }

    fetchFeeds();
</script>
